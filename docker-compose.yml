services:
  web:
    build: .
    container_name: dastak_fastapi_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=dastak_secret_key_2026_seva_challenge
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: dastak_redis_cache
    ports:
      - "6379:6379"
    restart: always