<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dastak • Skilled Technician Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F4F0] min-h-screen text-stone-900 font-sans pb-12 antialiased">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-2.5 flex justify-between items-center">
            
            <div class="flex items-center space-x-2">
                <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 22 32 A 28 28 0 0 0 22 68" stroke="#D97706" stroke-width="7" stroke-linecap="round"/>
                    <path d="M 78 32 A 28 28 0 0 0 78 68" stroke="#D97706" stroke-width="7" stroke-linecap="round"/>
                    <path d="M 50 15 C 34 15 22 27 22 43 C 22 63 50 85 50 85 C 50 85 78 63 78 43 C 78 27 66 15 50 15 Z" fill="#064E3B"/>
                    <circle cx="50" cy="43" r="14" fill="white"/>
                    <circle cx="50" cy="43" r="13" stroke="#064E3B" stroke-width="2" fill="none"/>
                    <line x1="50" y1="30" x2="50" y2="56" stroke="#064E3B" stroke-width="2"/>
                    <line x1="37" y1="43" x2="63" y2="43" stroke="#064E3B" stroke-width="2"/>
                </svg>

                <div class="flex flex-col">
                    <div class="flex items-baseline space-x-1">
                        <span class="font-extrabold text-lg tracking-tight text-[#064E3B]">DASTAK</span>
                        <span class="text-[10px] font-semibold text-amber-700">दस्तक</span>
                    </div>
                    <span class="text-[9px] font-semibold text-stone-500 uppercase tracking-widest">GIG TECHNICIAN</span>
                </div>
            </div>

            <span id="verificationBadge" class="text-xs font-semibold px-2.5 py-1 bg-amber-50 border border-amber-300 text-amber-800 rounded-full">
                Verification Pending
            </span>
        </div>

        <nav class="bg-[#064E3B] text-stone-200 text-[11px] py-1.5 px-4 flex justify-around font-medium border-t border-emerald-900">
            <a href="/" class="hover:text-amber-400">Resident</a>
            <span>•</span>
            <a href="/partner" class="hover:text-amber-400">Vendor</a>
            <span>•</span>
            <a href="/technician" class="text-amber-400 font-bold">Technician</a>
            <span>•</span>
            <a href="/guard" class="hover:text-amber-400">Security Guard</a>
        </nav>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <!-- Mandatory Skill India / e-Shram Identity Verification Module -->
        <section class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center border-b border-stone-100 pb-2">
                <h2 class="font-bold text-sm text-stone-800">1. Verification Credentials</h2>
                <span class="text-[10px] bg-stone-100 text-stone-600 font-bold px-2 py-0.5 rounded">Required for Clearance</span>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-stone-600 font-medium mb-1">Full Name</label>
                    <input type="text" id="techNameInput" value="Ramesh Kumar" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-stone-800 font-semibold focus:outline-none focus:border-emerald-600">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-stone-600 font-medium mb-1">Badge #</label>
                        <input type="number" id="techCanopyInput" value="304" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-stone-800 font-semibold focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-stone-600 font-medium mb-1">Specialization</label>
                        <select id="techTradeSelect" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-2 py-2 text-stone-800 font-semibold focus:outline-none focus:border-emerald-600 text-xs">
                            <option value="ELECTRICIAN">⚡ Electrician</option>
                            <option value="PLUMBER">🪠 Plumber</option>
                            <option value="CARPENTER">🪚 Carpenter</option>
                            <option value="AC_MECHANIC">❄️ AC Mechanic</option>
                        </select>
                    </div>
                </div>

                <!-- Credential Verification Inputs -->
                <div class="space-y-2 bg-stone-50 p-3 rounded-xl border border-stone-200">
                    <div>
                        <label class="block text-stone-600 font-medium mb-1">Skill India Certificate / e-Shram UAN #</label>
                        <input type="text" id="certNumberInput" value="NSDC-EL-2026-8942" class="w-full bg-white border border-stone-300 rounded-lg px-3 py-1.5 text-stone-800 font-mono text-xs focus:outline-none focus:border-emerald-600">
                    </div>

                    <div class="flex items-center space-x-2 pt-1">
                        <input type="checkbox" id="policeDeclaration" class="w-4 h-4 text-emerald-800 rounded border-stone-300 focus:ring-emerald-600" onchange="checkVerificationStatus()">
                        <label for="policeDeclaration" class="text-[11px] text-stone-600 font-medium">
                            I declare valid Police Clearance & Skill Certification
                        </label>
                    </div>
                </div>

                <button onclick="verifyCredentials()" id="verifyBtn" class="w-full py-2 bg-stone-900 hover:bg-black text-white font-bold rounded-xl text-xs transition">
                    Verify via Skill India / e-Shram Sandbox 🛡️
                </button>
            </div>
        </section>

        <!-- Availability Toggle & Gate Pass Generator -->
        <section class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm space-y-3">
            <h2 class="font-bold text-sm text-stone-800 border-b border-stone-100 pb-2">2. Campus Gate Clearance Pass</h2>

            <button id="techShiftBtn" disabled onclick="toggleTechShift()" class="w-full py-3.5 bg-stone-300 text-stone-500 font-bold rounded-xl text-base transition shadow-sm cursor-not-allowed">
                Complete Verification First
            </button>

            <div id="techPassContainer" class="hidden space-y-3 pt-2">
                <div class="flex justify-between items-center text-xs font-medium">
                    <span class="text-stone-500">Security Clearance Status:</span>
                    <span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-md font-mono text-[11px] font-bold">HMAC-SHA256 Authorized</span>
                </div>

                <div class="bg-stone-50 p-4 rounded-2xl border border-stone-200 flex flex-col items-center justify-center space-y-2">
                    <div class="p-2.5 bg-white rounded-xl shadow-sm border border-stone-200 flex items-center justify-center">
                        <img id="techQrImage" src="" alt="Gate Pass QR" class="w-40 h-40 object-contain">
                    </div>
                    <p class="font-semibold text-xs text-stone-700 text-center">Present this QR code to the Gate Guard upon entry</p>
                </div>

                <input type="text" id="techPassTokenInput" readonly class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 font-mono text-[10px] text-stone-600 focus:outline-none text-center font-bold">
            </div>
        </section>
    </main>

    <script>
        let isVerified = false;
        let isTechActive = false;

        function checkVerificationStatus() {
            const cert = document.getElementById('certNumberInput').value.trim();
            const checkbox = document.getElementById('policeDeclaration').checked;
            const verifyBtn = document.getElementById('verifyBtn');

            if (cert.length > 5 && checkbox) {
                verifyBtn.className = "w-full py-2 bg-[#064E3B] hover:bg-emerald-900 text-white font-bold rounded-xl text-xs transition";
            } else {
                verifyBtn.className = "w-full py-2 bg-stone-900 hover:bg-black text-white font-bold rounded-xl text-xs transition";
            }
        }

        function verifyCredentials() {
            const cert = document.getElementById('certNumberInput').value.trim();
            const checkbox = document.getElementById('policeDeclaration').checked;
            const badge = document.getElementById('verificationBadge');
            const shiftBtn = document.getElementById('techShiftBtn');

            if (!cert || cert.length < 5) {
                alert("Please enter a valid Skill India or e-Shram credential number.");
                return;
            }

            if (!checkbox) {
                alert("You must declare valid background verification.");
                return;
            }

            isVerified = true;
            badge.innerText = "e-Shram & Skill India Verified";
            badge.className = "text-xs font-semibold px-2.5 py-1 bg-emerald-100 border border-emerald-300 text-emerald-900 rounded-full";

            shiftBtn.disabled = false;
            shiftBtn.innerText = "Broadcasting Availability (Enter Campus)";
            shiftBtn.className = "w-full py-3.5 bg-[#064E3B] hover:bg-emerald-900 text-white font-bold rounded-xl text-base transition shadow-sm cursor-pointer";

            alert("Credential Verified via Public Infrastructure Sandbox! You can now enter the campus.");
        }

        async function toggleTechShift() {
            if (!isVerified) {
                alert("Only verified technicians are permitted on campus.");
                return;
            }

            const shiftBtn = document.getElementById('techShiftBtn');
            const passContainer = document.getElementById('techPassContainer');
            const tokenInput = document.getElementById('techPassTokenInput');
            const qrImage = document.getElementById('techQrImage');

            const name = document.getElementById('techNameInput').value.trim() || "Ramesh Kumar";
            const canopy = parseInt(document.getElementById('techCanopyInput').value) || 304;
            const category = document.getElementById('techTradeSelect').value;

            if (!isTechActive) {
                shiftBtn.disabled = true;
                shiftBtn.innerText = "Generating Security Pass...";

                try {
                    const response = await fetch('/api/v1/shift/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            worker_id: "GIG-TECH-" + canopy,
                            name: name,
                            category: category,
                            canopy_number: canopy
                        })
                    });

                    const data = await response.json();
                    const token = data.gate_pass.pass_token;

                    tokenInput.value = token;
                    qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(token)}`;
                    passContainer.classList.remove('hidden');

                    isTechActive = true;
                    shiftBtn.innerText = "Leave Campus (End Availability)";
                    shiftBtn.className = "w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-base transition shadow-sm cursor-pointer";

                } catch (err) {
                    alert("Failed to connect to backend server.");
                    shiftBtn.innerText = "Broadcasting Availability (Enter Campus)";
                } finally {
                    shiftBtn.disabled = false;
                }
            } else {
                isTechActive = false;
                passContainer.classList.add('hidden');
                shiftBtn.innerText = "Broadcasting Availability (Enter Campus)";
                shiftBtn.className = "w-full py-3.5 bg-[#064E3B] hover:bg-emerald-900 text-white font-bold rounded-xl text-base transition shadow-sm cursor-pointer";
            }
        }
    </script>
</body>
</html>
